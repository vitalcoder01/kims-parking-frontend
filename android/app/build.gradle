apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Ship only the icon font we actually use.
//
// fonts.gradle packages all 12 vector-icons families by default -- 3.7 MB,
// of which 2.6 MB is fonts nothing references. src/components/Icon.tsx has
// the only vector-icons import in the app (MaterialCommunityIcons), and no
// dependency pulls the package either, so the other eleven were pure
// weight.
//
// fonts.gradle reads project.vectoricons inside afterEvaluate and defaults
// to ["*.ttf"] when it is absent, so the name has to match exactly -- a
// typo'd key silently falls back to copying all twelve again. If a second
// family is ever imported, add its .ttf here or its glyphs render as empty
// boxes.
project.ext.vectoricons = [
    iconFontNames: ['MaterialCommunityIcons.ttf']
]

apply from: "../../node_modules/react-native-vector-icons/fonts.gradle"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Run R8 on release builds to shrink the Java bytecode. Off, on purpose.
 *
 * The dex looks like 22 MB when measured uncompressed, which makes R8 look
 * like the biggest win available. In the APK it compresses to 8.23 MB, so
 * R8 can take off roughly 2.5-4 MB -- against the 30.9 MB that dropping
 * the x86 ABIs and the unused fonts removes for free.
 *
 * That is about 7% of the total saving in exchange for the one risk in
 * this area that does not announce itself. R8 strips what it cannot see
 * referenced, and the bridge, notifee, FCM and WebView are all reached by
 * reflection or JNI; when a keep rule is missing the APK still builds,
 * installs and opens perfectly, and something simply never runs. That is
 * the exact shape of 1.9.12, which looked healthy and alerted nobody.
 *
 * Not worth 4 MB. proguard-rules.pro is written and kept ready, so this is
 * a one-line change if the trade ever looks different -- but flipping it
 * to true means the next build MUST be checked on a real device:
 * notifications arriving AND vibrating, both maps rendering, login.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.kimsparking"
    defaultConfig {
        applicationId "com.kimsparking"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 50
        versionName "1.9.16"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Real release key when keystore.properties is present (local
            // machine / CI with the secret provisioned); falls back to the
            // debug key only so a from-scratch checkout without the keystore
            // can still build for local testing — never use that fallback
            // for anything actually distributed.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

            // Ship ARM only.
            //
            // x86 and x86_64 are emulator architectures -- no Android phone
            // runs them -- and they were 29.5 MB of the APK's 53.4 MB of
            // native libraries. Every user was downloading two full copies
            // of the native runtime that their device can never load.
            //
            // Deliberately scoped to the release build rather than set via
            // gradle.properties' reactNativeArchitectures, so debug builds
            // keep all four and an x86_64 emulator still works for local
            // development. Nothing about the dev workflow changes.
            //
            // armeabi-v7a stays: it covers older 32-bit handsets, and a
            // phone that cannot install the APK at all is a far worse
            // outcome than 9.7 MB. Drop it only once the device fleet is
            // confirmed to be entirely arm64.
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }

            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"

            // shrinkResources is deliberately NOT enabled alongside the
            // above. React Native resolves drawables by name at runtime
            // (require('./img.png') becomes a getIdentifier lookup), so the
            // resource shrinker sees no reference to them and strips images
            // that are genuinely used -- they then fail to render with no
            // build-time warning. res/ is only 0.7 MB here, so it would buy
            // very little for a real risk of missing artwork.
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Apply Firebase's Google Services plugin only when the config file is
// present — the app builds and runs fine without it (FCM just stays off,
// guarded in JS), so a fresh checkout isn't blocked on Firebase setup.
def googleServicesJson = file('google-services.json')
if (googleServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.warn('google-services.json not found - building WITHOUT Firebase push (FCM disabled)')
}

/*
 * Make the vector-icons font copy behave like a sync.
 *
 * fonts.gradle uses a plain Copy task, which only ever ADDS files -- it
 * never removes a font that has left iconFontNames. The whole intermediates
 * directory is registered as an assets source dir, so fonts copied by an
 * earlier build keep getting packaged: after narrowing iconFontNames to one
 * family, an incremental build still shipped all nineteen sitting in that
 * folder from before, and the APK would not shrink by a single byte with
 * nothing to indicate why.
 *
 * Clearing the directory first makes the output match the declared list on
 * every build, clean or not. upToDateWhen(false) is required alongside it:
 * without it Gradle can skip the task as up-to-date while doFirst has
 * already deleted the fonts, packaging none at all and rendering every icon
 * as an empty box. Re-copying one 1.1 MB file per build is not worth
 * optimising.
 *
 * Registered from here, after fonts.gradle has been applied, so its own
 * afterEvaluate has already created the task by the time this runs.
 */
afterEvaluate {
    def fontsTask = tasks.findByName("copyReactNativeVectorIconFonts")
    if (fontsTask != null) {
        def stagedFontsDir = file("$buildDir/intermediates/ReactNativeVectorIcons/fonts")
        fontsTask.outputs.upToDateWhen { false }
        fontsTask.doFirst {
            delete stagedFontsDir
        }
    }
}
